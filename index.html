<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Tool</title>
<style>
  :root {
    --bg:   #000;
    --ink:  #fff;
    --rule: rgba(255, 255, 255, .28);
    --mute: rgba(255, 255, 255, .55);
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: #fff; color: #000; }

  body {
    height: 100vh;
    display: flex;
    background: var(--bg);
    color: var(--ink);
    font: 11px/1.4 "Helvetica Neue", Helvetica, Arial, "Malgun Gothic", sans-serif;
    overflow: hidden;
  }

  /* ---- mosaic ---- */
  .stage {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #mosaic { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #canvas { display: block; touch-action: none; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  /* ---- Swiss control bar (right) ---- */
  .bar {
    width: 272px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 28px;
  }


  .row {
    display: grid;
    grid-template-columns: 22px 1fr;
    padding: 14px 0 16px;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }
  .vlabel {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    align-self: start;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    min-height: 92px;
    padding: 9px 10px;
    font: 15px/1.35 "Helvetica Neue", Helvetica, Arial, "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 0;
    resize: vertical;
    caret-color: var(--ink);
  }
  textarea::placeholder { color: var(--mute); }
  textarea:focus { outline: 1px solid var(--ink); outline-offset: 3px; }

  .big { display: flex; align-items: baseline; gap: 4px; margin-bottom: 8px; }
  .big output { font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .big small { color: var(--mute); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; background: var(--ink); border-radius: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--ink); }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; background: var(--ink); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .ticks { display: flex; justify-content: space-between; color: var(--mute); font-size: 9px; margin-top: 2px; }

  button {
    font: inherit;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 6px 10px;
    cursor: pointer;
  }
  button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  /* where the fingertip is, while the camera sees a hand */
  #finger {
    position: fixed;
    left: 0;
    top: 0;
    border: 1px solid var(--rule);
    border-radius: 50%;
    pointer-events: none;
    display: none;
  }

  /* camera preview, mirrored like a selfie; the dot is the tracked fingertip */
  .view { position: relative; aspect-ratio: 4 / 3; border: 1px solid var(--rule); overflow: hidden; }
  .view video { display: block; width: 100%; height: 100%; transform: scaleX(-1); }
  .view i {
    position: absolute;
    left: 0;
    top: 0;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    background: var(--ink);
    border-radius: 50%;
    display: none;
  }


  /* ---- narrow screens: stack ---- */
  @media (max-width: 860px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
    #mosaic { height: 50vw; min-height: 200px; }
    .bar { width: 100%; padding: 16px 16px 24px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div id="mosaic"><canvas id="canvas"></canvas></div>
  </main>
  <div id="finger"></div>

  <aside class="bar">
    <div class="row">
      <div class="vlabel">Input</div>
      <textarea id="input" rows="3" placeholder="텍스트를 입력하세요" autofocus>MUSHROOM</textarea>
    </div>

    <div class="row">
      <div class="vlabel">Size</div>
      <div>
        <div class="big"><output id="sizeVal">10</output><small>px</small></div>
        <input id="size" type="range" min="6" max="28" value="10">
        <div class="ticks"><span>06</span><span>28</span></div>
      </div>
    </div>

    <div class="row">
      <div class="vlabel">Force</div>
      <div>
        <div class="big"><output id="forceVal">05</output><small>/ 05</small></div>
        <input id="force" type="range" min="1" max="5" value="5">
        <div class="ticks"><span>01</span><span>05</span></div>
      </div>
    </div>

    <div class="row">
      <div class="vlabel">Camera</div>
      <div>
        <div class="big"><output id="camVal">OFF</output></div>
        <button id="cam" type="button" aria-pressed="false">Track</button>
      </div>
    </div>

    <div class="row">
      <div class="vlabel">Video</div>
      <div class="view"><video id="video" muted playsinline></video><i id="tip"></i></div>
    </div>

  </aside>

const input  = document.getElementById('input');
const size   = document.getElementById('size');
const canvas = document.getElementById('canvas');
const stage  = document.getElementById('mosaic');
const ctx    = canvas.getContext('2d');

const BG_LUM = 34;           // cells darker than this are treated as background
const GUTTER = 0;            // gap between the two halves (source pixels)
const FONT = '"Arial Black", "Segoe UI Black", "Malgun Gothic", sans-serif';

// The portrait photo is cut in half; the top half goes left, the bottom half right.
let src = null;
const img = new Image();
img.onload = () => {
  const iw = img.naturalWidth, ih = img.naturalHeight, half = Math.ceil(ih / 2);
  src = document.createElement('canvas');
  src.width = iw * 2 + GUTTER;
  src.height = half;
  const sc = src.getContext('2d');
  sc.fillStyle = '#000';
  sc.fillRect(0, 0, src.width, src.height);
  sc.drawImage(img, 0, 0, iw, half, 0, 0, iw, half);
  sc.drawImage(img, 0, half, iw, ih - half, iw + GUTTER, 0, iw, ih - half);
  render();
};
img.src = IMG_SRC;

// Shrink the source to cols x rows by repeated halving (avoids aliasing)
function sampleGrid(cols, rows) {
  let cur = src, w = src.width, h = src.height;
  while (w / 2 > cols && h / 2 > rows) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w / 2); c.height = Math.ceil(h / 2);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(cur, 0, 0, c.width, c.height);
    cur = c; w = c.width; h = c.height;
  }
  const c = document.createElement('canvas');
  c.width = cols; c.height = rows;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(cur, 0, 0, cols, rows);
  return cx.getImageData(0, 0, cols, rows).data;
}

// Thin glyphs look dull next to solid pixels, so lift brightness and saturation
function vivid(r, g, b, lum) {
  const f = c => Math.min(255, 255 * Math.pow(Math.max(0, lum + (c - lum) * 1.35) / 255, 0.7));
  return [f(r), f(g), f(b)].map(Math.round);
}

/* ---------- Particles ---------- */
let dpr = 1, sprPx = 0, curCellH = 10;
const spriteCache = new Map();
// All sprites live on shared atlas sheets, so the GPU can batch the draws instead of switching textures per letter
const ATLAS = 2048;          // atlas sheet size (device px); a new sheet starts when one fills up
let atlas = null, atlasCtx = null, atlasN = 0;
const blit = (s, x, y) => ctx.drawImage(s.img, s.sx, s.sy, sprPx, sprPx, x, y, sprPx, sprPx);
let P = null;                                   // current particle set
let TS = 1, tw = 1, th = 1, seen = null, stamp = null, lastTiles = [], frameNo = 0;

// One pre-drawn atlas slot per (char, quantised colour): drawing 10k glyphs per frame stays cheap
function getSprite(ch, r, g, b) {
  const q = v => Math.min(255, Math.round(v / 16) * 16);
  const cr = q(r), cg = q(g), cb = q(b);
  const key = ch + cr + ',' + cg + ',' + cb;
  let spr = spriteCache.get(key);
  if (spr) return spr;
  const per = Math.floor(ATLAS / sprPx);
  if (spriteCache.size === 0 || atlasN >= per * per) {
    atlas = document.createElement('canvas');
    atlas.width = atlas.height = ATLAS;
    atlasCtx = atlas.getContext('2d');
    atlasN = 0;
  }
  spr = { img: atlas, sx: (atlasN % per) * sprPx, sy: Math.floor(atlasN / per) * sprPx };
  atlasN++;
  const c = atlasCtx;
  c.save();
  c.beginPath(); c.rect(spr.sx, spr.sy, sprPx, sprPx); c.clip();       // keep each glyph inside its slot
  c.translate(spr.sx, spr.sy);
  const wide = ch.charCodeAt(0) > 0x2E80;                        // Hangul etc. are ~2x wider
  c.font = `900 ${curCellH * dpr * (wide ? 0.75 : 0.98)}px ${FONT}`;
  c.fillStyle = `rgb(${cr},${cg},${cb})`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(ch, sprPx / 2, sprPx / 2);
  c.restore();
  spriteCache.set(key, spr);
  return spr;
}

function render() {
  if (!src) return;

  dpr = window.devicePixelRatio || 1;
  const W = stage.clientWidth, H = stage.clientHeight;
  if (W < 10 || H < 10) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  const chars = [...input.value.replace(/\s+/g, '')];
  const cols = Math.max(1, Math.round(W / (size.value * 0.74)));
  const rows = Math.max(1, Math.round(H / size.value));
  const cellW = W / cols, cellH = H / rows;             // cells stretch to meet every edge

  spriteCache.clear();
  curCellH = cellH;
  sprPx = 2 * Math.ceil(cellH * 0.7 * dpr);             // even, so rest positions stay pixel-crisp

  const cx = [], cy = [], sp = [], ci = [];
  if (chars.length && cols > 0 && rows > 0) {
    const px = sampleGrid(cols, rows);
    let k = 0;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        const r0 = px[i], g0 = px[i + 1], b0 = px[i + 2];
        const lum = 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
        if (lum < BG_LUM) continue;                                  // background: leave black
        const [r, g, b] = vivid(r0, g0, b0, lum);
        cx.push(x * cellW + cellW / 2);
        cy.push(y * cellH + cellH / 2);
        ci.push(y * cols + x);
        sp.push(getSprite(chars[k++ % chars.length], r, g, b));
      }
    }
  }

  const n = cx.length;
  P = {
    n, spr: sp,
    cx: Float32Array.from(cx), cy: Float32Array.from(cy),           // home (css px)
    x: Float32Array.from(cx),  y: Float32Array.from(cy),            // current
    vx: new Float32Array(n), vy: new Float32Array(n),
    r: new Float32Array(n),  vr: new Float32Array(n),               // rotation
    rest: new Uint8Array(n).fill(1),
    tx: new Int32Array(n), ty: new Int32Array(n),                   // rest top-left (device px)
    cols, rows, cellW, cellH,
    cellId: new Int32Array(cols * rows).fill(-1),                   // grid cell -> letter id
    act: new Int32Array(n), na: 0,                                  // letters that are currently moving
  };
  for (let i = 0; i < n; i++) P.cellId[ci[i]] = i;
  // dirty-tile bookkeeping: only tiles touched by moving letters get repainted
  TS = Math.max(16, Math.round(40 * dpr));
  tw = Math.ceil(canvas.width / TS); th = Math.ceil(canvas.height / TS);
  seen = new Int32Array(tw * th); stamp = new Int32Array(n); lastTiles = []; frameNo = 0;
  for (let i = 0; i < n; i++) {
    P.tx[i] = Math.round(P.cx[i] * dpr - sprPx / 2);
    P.ty[i] = Math.round(P.cy[i] * dpr - sprPx / 2);
  }
  draw();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!P) return;
  const half = sprPx / 2;
  for (let i = 0; i < P.n; i++) {                                   // settled letters first
    if (P.rest[i]) blit(P.spr[i], P.tx[i], P.ty[i]);
  }
  for (let i = 0; i < P.n; i++) {                                   // flying letters on top
    if (P.rest[i]) continue;
    const c = Math.cos(P.r[i]), s = Math.sin(P.r[i]);
    ctx.setTransform(c, s, -s, c, P.x[i] * dpr, P.y[i] * dpr);
    blit(P.spr[i], -half, -half);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---------- Mouse: scatter the letters ---------- */
const RADIUS = 45;           // css px
const PUSH   = 3.6;          // outward kick
const SWIRL  = 1.6;          // sideways kick, makes them swirl instead of just flee
const FLING  = 0.35;         // how much cursor speed is handed to the letters
const SPIN   = 0.45;         // random spin
const SPRING = 0.010;        // pull back to home
const DAMP   = 0.955;        // per-frame velocity damping

let force = 1;                 // 1 = default; set by the Force slider (value / 5)
let mouse = null, mvx = 0, mvy = 0, pressed = false, running = false, lastT = 0;

function kick() {
  if (running) return;
  running = true;
  lastT = performance.now();
  requestAnimationFrame(tick);
}

// Repaint just the given tiles: rest letters that overlap them (in original z-order), then the flyers
function drawTiles(tiles) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save();
  ctx.beginPath();
  for (const t of tiles) ctx.rect((t % tw) * TS, Math.floor(t / tw) * TS, TS, TS);
  ctx.clip();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const m = sprPx * 0.6 / dpr, ids = [];
  for (const t of tiles) {
    const x0 = (t % tw) * TS / dpr, y0 = Math.floor(t / tw) * TS / dpr;
    const c0 = Math.max(0, Math.floor((x0 - m) / P.cellW)), c1 = Math.min(P.cols - 1, Math.floor((x0 + TS / dpr + m) / P.cellW));
    const r0 = Math.max(0, Math.floor((y0 - m) / P.cellH)), r1 = Math.min(P.rows - 1, Math.floor((y0 + TS / dpr + m) / P.cellH));
    for (let ry = r0; ry <= r1; ry++) {
      for (let cx = c0; cx <= c1; cx++) {
        const id = P.cellId[ry * P.cols + cx];
        if (id >= 0 && P.rest[id] && stamp[id] !== frameNo) { stamp[id] = frameNo; ids.push(id); }
      }
    }
  }
  ids.sort((a, b) => a - b);
  for (const id of ids) blit(P.spr[id], P.tx[id], P.ty[id]);

  const half = sprPx / 2;
  for (let a = 0; a < P.na; a++) {
    const i = P.act[a], c = Math.cos(P.r[i]), s = Math.sin(P.r[i]);
    ctx.setTransform(c, s, -s, c, P.x[i] * dpr, P.y[i] * dpr);
    blit(P.spr[i], -half, -half);
  }
  ctx.restore();
}

/* ---------- Sound effects: rustle while letters fly, a tick as each one lands back home ---------- */
const SFX_VOLUME   = 0.5;    // master volume (0..1)
const SFX_RUSTLE   = 0.00025; // summed letter speed -> rustle loudness
const SFX_TICK_GAP = 25;     // ms between landing ticks at most

let sfx = null, lastTickSfx = 0;

// Audio may only start from a click or touch, so this runs on the first one
function sfxInit() {
  if (sfx) { sfx.ac.resume(); return; }
  const ac = new AudioContext();
  const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const ch = noise.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const master = ac.createGain();
  master.gain.value = SFX_VOLUME;
  master.connect(ac.destination);
  const src = ac.createBufferSource();                              // endless noise -> bandpass -> gain = rustle
  src.buffer = noise; src.loop = true;
  const band = ac.createBiquadFilter();
  band.type = 'bandpass'; band.frequency.value = 1200; band.Q.value = 0.8;
  const rustle = ac.createGain();
  rustle.gain.value = 0;
  src.connect(band).connect(rustle).connect(master);
  src.start();
  sfx = { ac, noise, master, band, rustle };
}

// called once per animation frame with the summed speed of moving letters and how many just landed
function sfxFrame(speed, landed, now) {
  if (!sfx) return;
  const t = sfx.ac.currentTime, loud = Math.min(1, Math.sqrt(speed * SFX_RUSTLE));
  sfx.rustle.gain.setTargetAtTime(loud * 0.6, t, 0.06);             // glide, never jump
  sfx.band.frequency.setTargetAtTime(700 + 3200 * loud, t, 0.08);
  if (landed && now - lastTickSfx > SFX_TICK_GAP) {
    lastTickSfx = now;
    const src = sfx.ac.createBufferSource();
    src.buffer = sfx.noise;
    const hp = sfx.ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2500 + Math.random() * 3000;
    const g = sfx.ac.createGain();
    const v = Math.min(1, 0.25 + landed * 0.05) * 0.5;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(hp).connect(g).connect(sfx.master);
    src.start(t, Math.random() * 1.9, 0.04);
  }
}

function tick(now) {
  const dt = Math.min(2.5, (now - lastT) / 16.67 || 1);
  lastT = now;
  const damp = Math.pow(DAMP, dt), rdamp = Math.pow(0.93, dt);
  const R = RADIUS * (0.7 + 0.3 * force), R2 = R * R;
  frameNo++;

  // wake the resting letters under the cursor (looked up by grid cell, not by scanning everything)
  if (mouse) {
    const c0 = Math.max(0, Math.floor((mouse.x - R) / P.cellW)), c1 = Math.min(P.cols - 1, Math.floor((mouse.x + R) / P.cellW));
    const r0 = Math.max(0, Math.floor((mouse.y - R) / P.cellH)), r1 = Math.min(P.rows - 1, Math.floor((mouse.y + R) / P.cellH));
    for (let ry = r0; ry <= r1; ry++) {
      for (let cx = c0; cx <= c1; cx++) {
        const id = P.cellId[ry * P.cols + cx];
        if (id < 0 || !P.rest[id]) continue;
        const dx = P.cx[id] - mouse.x, dy = P.cy[id] - mouse.y;
        if (dx * dx + dy * dy < R2) { P.rest[id] = 0; P.act[P.na++] = id; }
      }
    }
  }

  const cur = [];                                   // tiles touched by letters this frame
  const mark = (x, y) => {
    const mg = sprPx * 0.75 / dpr;                  // half-diagonal of a rotated sprite
    const t0 = Math.max(0, Math.floor((x - mg) * dpr / TS)), t1 = Math.min(tw - 1, Math.floor((x + mg) * dpr / TS));
    const u0 = Math.max(0, Math.floor((y - mg) * dpr / TS)), u1 = Math.min(th - 1, Math.floor((y + mg) * dpr / TS));
    for (let v = u0; v <= u1; v++) for (let u = t0; u <= t1; u++) {
      const t = v * tw + u;
      if (seen[t] !== frameNo) { seen[t] = frameNo; cur.push(t); }
    }
  };

  let speedSum = 0, landed = 0;                     // for the sound effects
  for (let a = P.na - 1; a >= 0; a--) {             // only moving letters are simulated
    const i = P.act[a];
    let vx = P.vx[i], vy = P.vy[i], vr = P.vr[i];
    let x = P.x[i], y = P.y[i], r = P.r[i];

    if (mouse) {
      const dx = x - mouse.x, dy = y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) || 0.001, f0 = 1 - d / R, f = f0 * f0 * force;
        vx += ((dx / d) * PUSH - (dy / d) * SWIRL + mvx * FLING + (Math.random() - .5) * 2) * f * dt;
        vy += ((dy / d) * PUSH + (dx / d) * SWIRL + mvy * FLING + (Math.random() - .5) * 2) * f * dt;
        vr += (Math.random() - .5) * SPIN * f;
      }
    }

    vx += (P.cx[i] - x) * SPRING * dt;
    vy += (P.cy[i] - y) * SPRING * dt;
    vr -= r * 0.02 * dt;
    vx *= damp; vy *= damp; vr *= rdamp;
    x += vx * dt; y += vy * dt; r += vr * dt;

    const still = Math.abs(vx) + Math.abs(vy) < 0.03 && Math.abs(P.cx[i] - x) + Math.abs(P.cy[i] - y) < 0.25
                  && Math.abs(r) < 0.02 && Math.abs(vr) < 0.005;
    if (still) {                                                     // snap home, crisp again
      x = P.cx[i]; y = P.cy[i]; r = vx = vy = vr = 0;
      P.rest[i] = 1;
      P.act[a] = P.act[--P.na];
      landed++;
    }
    speedSum += Math.abs(vx) + Math.abs(vy);
    P.vx[i] = vx; P.vy[i] = vy; P.vr[i] = vr; P.x[i] = x; P.y[i] = y; P.r[i] = r;
    mark(x, y);
  }

  sfxFrame(speedSum, landed, now);
  mvx *= Math.pow(0.9, dt); mvy *= Math.pow(0.9, dt);

  // repaint = tiles touched now + tiles touched last frame (to erase the old positions)
  const all = cur.slice();
  for (const t of lastTiles) if (seen[t] !== frameNo) { seen[t] = frameNo; all.push(t); }
  lastTiles = cur;
  if (all.length) drawTiles(all);

  if (P.na > 0) requestAnimationFrame(tick); else running = false;
}

function pointAt(x, y) {
  if (mouse) { mvx = mvx * 0.5 + (x - mouse.x) * 0.5; mvy = mvy * 0.5 + (y - mouse.y) * 0.5; }
  mouse = { x, y };
}
function setMouse(e) {
  const rc = canvas.getBoundingClientRect();
  pointAt(e.clientX - rc.left, e.clientY - rc.top);
}
canvas.addEventListener('pointerdown', e => {
  sfxInit();
  pressed = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}      // keep dragging outside the canvas
  mouse = null; mvx = mvy = 0;
  setMouse(e);
  kick();
});
canvas.addEventListener('pointermove', e => {
  if (!pressed) return;                                            // hovering does nothing
  setMouse(e);
  kick();
});
const release = () => { pressed = false; mouse = null; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

/* ---------- Camera: the index fingertip pushes letters like a held-down mouse ---------- */
const CAM_LIB    = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const CAM_MODEL  = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const CAM_MARGIN = 0.12;     // camera edge band that maps past the canvas edge, so the corners are easy to reach
const CAM_SMOOTH = 0.35;     // per-frame glide of the finger point toward the detected tip (0..1)
const CAM_EVERY  = 33;       // ms between hand detections (~30 per second)

let cam = null, hands = null, camBusy = false, finger = null, fingerAt = null, lastDetect = 0, camShown = '';
const ring = document.getElementById('finger');
const tipDot = document.getElementById('tip');

function showCam(msg) {
  const btn = document.getElementById('cam');
  btn.setAttribute('aria-pressed', cam ? 'true' : 'false');
  btn.textContent = cam ? 'Stop' : 'Track';
  btn.disabled = camBusy;
  if (msg === camShown) return;
  camShown = msg;
  document.getElementById('camVal').textContent = msg;
}

async function loadHands() {
  const { FilesetResolver, HandLandmarker } = await import(CAM_LIB + '/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks(CAM_LIB + '/wasm');
  const opts = delegate => ({ baseOptions: { modelAssetPath: CAM_MODEL, delegate }, runningMode: 'VIDEO', numHands: 1 });
  try { return await HandLandmarker.createFromOptions(files, opts('GPU')); }
  catch (_) { return await HandLandmarker.createFromOptions(files, opts('CPU')); }
}

function dropFinger() {
  finger = fingerAt = null;
  ring.style.display = 'none';
  tipDot.style.display = 'none';
  if (!pressed) mouse = null;
}

async function toggleCam() {
  if (camBusy) return;
  sfxInit();
  if (cam) {
    cam.stream.getTracks().forEach(t => t.stop());
    cam.video.srcObject = null;
    cam = null;
    dropFinger();
    showCam('OFF');
    return;
  }
  camBusy = true;
  showCam('WAIT');
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();
    video.parentNode.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
    if (!hands) hands = await loadHands();                          // ~8 MB model, loaded once
    cam = { stream, video, lastTime: -1 };
    camBusy = false;
    showCam('NONE');
    requestAnimationFrame(camLoop);
  } catch (_) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    camBusy = false;
    showCam('—');
  }
}

function camLoop(now) {
  if (!cam) return;
  const v = cam.video;
  if (now - lastDetect >= CAM_EVERY && v.readyState >= 2 && v.currentTime !== cam.lastTime) {
    lastDetect = now; cam.lastTime = v.currentTime;
    const tip = hands.detectForVideo(v, now).landmarks?.[0]?.[8];   // landmark 8 = index fingertip
    if (tip) {
      tipDot.style.left = (1 - tip.x) * 100 + '%';
      tipDot.style.top = tip.y * 100 + '%';
      tipDot.style.display = 'block';
      const m = u => Math.min(1, Math.max(0, (u - CAM_MARGIN) / (1 - 2 * CAM_MARGIN)));
      fingerAt = { x: (1 - m(tip.x)) * canvas.clientWidth, y: m(tip.y) * canvas.clientHeight };  // mirrored, like a selfie
    } else { fingerAt = null; tipDot.style.display = 'none'; }
    showCam(fingerAt ? 'HAND' : 'NONE');
  }

  if (fingerAt && P) {
    if (!finger) { finger = { ...fingerAt }; if (!pressed) { mouse = null; mvx = mvy = 0; } }
    finger.x += (fingerAt.x - finger.x) * CAM_SMOOTH;
    finger.y += (fingerAt.y - finger.y) * CAM_SMOOTH;
    if (!pressed) { pointAt(finger.x, finger.y); kick(); }        // a real mouse drag takes priority
    const R = RADIUS * (0.7 + 0.3 * force), rc = canvas.getBoundingClientRect();
    ring.style.width = ring.style.height = 2 * R + 'px';
    ring.style.transform = `translate(${rc.left + finger.x - R}px, ${rc.top + finger.y - R}px)`;
    ring.style.display = 'block';
  } else if (finger) dropFinger();

  requestAnimationFrame(camLoop);
}

document.getElementById('cam').addEventListener('click', toggleCam);
document.getElementById('force').addEventListener('input', e => {
  force = e.target.value / 5;
  document.getElementById('forceVal').textContent = String(e.target.value).padStart(2, '0');
});
input.addEventListener('input', render);
size.addEventListener('input', () => {
  document.getElementById('sizeVal').textContent = String(size.value).padStart(2, '0');
  render();
});
new ResizeObserver(render).observe(stage);
</script>
</body>
</html>
